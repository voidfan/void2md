services:
  void2md:
    image: void2md/void2md:latest
    build:
      context: .
    # Publish the API port. (network_mode: host does not expose ports to the
    # macOS host with Docker Desktop; use host mode only on a Linux host.)
    ports:
      - "3457:3457"
    volumes:
      # Overrides the dbc config inside the container (matches DBC_CONFIG in the Dockerfile)
      - ./dbc/config/config.json:/app/dbc/config/config.json:ro
    # Lets the structured S3 store reach object storage published on the host
    # (the file_database knowledge-base feature). Docker Desktop provides this
    # name already; the entry makes it work on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  dbx:
    image: t8y2/dbx:latest
    network_mode: host
    volumes:
      - dbx-data:/app/data
    environment:
      # Disable password for development (remove in production)
      - DBX_DISABLE_PASSWORD=1
      # Enable MCP HTTP endpoint with fixed secure token
      - DBX_WEB_MCP_TOKEN=my-secure-mcp-token-2026
      # Allow localhost access to MCP endpoint
      - DBX_WEB_MCP_ALLOWED_HOSTS=localhost:4225,host.docker.internal:4225
    restart: unless-stopped

volumes:
  dbx-data:
